<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-model chat</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; }
  #log { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; max-width: 85%; }
  .user { align-self: flex-end; background: #dbe7ff; color: #10213f; }
  .assistant { align-self: flex-start; background: #eef0f3; color: #17202b; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; font: inherit; }
  button, select { padding: 10px 18px; font: inherit; }
</style>
</head>
<body>
<h1 id="title">Chat</h1>
<div id="log"></div>
<form id="form">
  <select id="model" hidden></select>
  <input id="question" placeholder="Ask a question" autocomplete="off" required>
  <button id="send">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const input = document.getElementById("question");
  const send = document.getElementById("send");
  const model = document.getElementById("model");
  const messages = [];
  let project = new URLSearchParams(location.search).get("project");

  fetch("/v1/projects").then(r => r.json()).then(list => {
    const found = list.find(p => p.slug === project) || list[0];
    if (!found) { document.getElementById("title").textContent = "No projects configured"; return; }
    project = found.slug;
    document.getElementById("title").textContent = found.name + " chat";
    found.models.forEach(name => model.add(new Option(name)));
    model.hidden = found.models.length < 2;
  });

  function bubble(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    log.appendChild(el);
    el.scrollIntoView({ block: "end" });
    return el;
  }

  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question || !project) return;
    input.value = "";
    send.disabled = true;
    messages.push({ role: "user", content: question });
    bubble("user", question);
    const el = bubble("assistant", "…");
    let answer = "";
    try {
      const res = await fetch(`/v1/${project}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, model: model.value || null }),
      });
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        answer += decoder.decode(value, { stream: true });
        el.textContent = answer;
      }
      messages.push({ role: "assistant", content: answer });
    } catch (err) {
      messages.pop();
      el.textContent = "Could not get an answer: " + err.message;
    }
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
