[project]
name = "local-model"
version = "0.1.0"
description = "Shared self-hosted LLM service: per-project chat agents over an OpenAI-compatible model server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "qdrant-client>=1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_model*"]

[tool.setuptools.package-data]
local_model = ["web/*"]
