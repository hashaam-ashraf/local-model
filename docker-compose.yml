services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: local-model-api
    env_file: .env
    volumes:
      - ./projects:/app/projects:ro
      - ./kb:/app/kb
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: [ollama, qdrant]

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"  # OpenAI-compatible endpoint for other projects on this host
    # On a GPU host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant:/qdrant/storage

volumes:
  ollama:
  qdrant:
