services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: local-model-api
    env_file: .env
    volumes:
      - ./kb:/app/kb
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"  # OpenAI-compatible endpoint for other projects on this host
    # On a GPU host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant:/qdrant/storage

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: local_model
      POSTGRES_PASSWORD: local_model
      POSTGRES_DB: local_model
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"  # for pgAdmin and other tools on this host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_model"]
      interval: 5s
      retries: 10

volumes:
  ollama:
  qdrant:
  postgres:
